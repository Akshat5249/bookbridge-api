name: Offline checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Offline evaluator
        run: |
          python scripts/fake_upstream.py --port 8765 > /tmp/upstream.log 2>&1 &
          UPSTREAM_PID=$!
          BOOKBRIDGE_UPSTREAM_BASE_URL=http://127.0.0.1:8765 python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" "$UPSTREAM_PID"' EXIT
          python - <<'PY'
          import time, urllib.request, urllib.error
          for _ in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).close()
                  break
              except (urllib.error.URLError, OSError):
                  time.sleep(0.1)
          else:
              raise SystemExit('API did not start')
          PY
          python scripts/test_api.py --base-url http://localhost:8000
      - run: docker build -t bookbridge-api .
